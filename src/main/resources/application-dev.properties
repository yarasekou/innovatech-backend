# ============================================================
# DATABASE (DEV)
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/innovatech?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# JWT (DEV)
# ============================================================
jwt.secret=${JWT_SECRET:dev-secret-key-change-in-production-please-use-a-long-random-string-here-minimum-256-bits}

# ============================================================
# LOGS
# ============================================================
logging.level.root=INFO
logging.level.com.innovatech.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG