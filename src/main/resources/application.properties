# ===========================================
# InnovaTech API - Configuration
# ===========================================

spring.application.name=innova-tech-api

# -------------------------------------------
# Base de données MySQL
# -------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/innovatech?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# -------------------------------------------
# JPA / Hibernate
# -------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# -------------------------------------------
# Serveur HTTP
# -------------------------------------------
server.port=8080
server.servlet.context-path=/api

# -------------------------------------------
# Logs
# -------------------------------------------
logging.level.root=INFO
logging.level.com.innovatech.api=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# -------------------------------------------
# JWT Configuration
# -------------------------------------------
# ⚠️ En prod : utiliser une variable d'environnement, JAMAIS ce secret en clair
jwt.secret=InnovaTechSecretKey2026VeryLongAndSecureForHS256AlgorithmAtLeast32Bytes
jwt.expiration=86400000
jwt.refresh-expiration=604800000